name: Render Keep-Alive Pinger

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping after 15 mins of inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Office Pro Render Service
        run: |
          echo "Pinging Office Pro on Render to keep web container active..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://nexuswave-officepro.onrender.com/healthz/")
          echo "HTTP response status: $STATUS"
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 301 ] || [ "$STATUS" -eq 302 ]; then
            echo "Keep-alive ping successful. Server is awake."
          else
            echo "Unexpected status code ($STATUS), but request reached Render and initiated/maintained container."
          fi
